[pytest]
python_files =
    test_*.py

python_functions =
    test_*

addopts =
    --strict-markers
    --tb=short

markers =
    parquet_data: marks tests that validate Parquet datasets
    smoke: marks smoke tests
    example: marks technical framework example tests
    facility_name_min_time_spent_per_visit_date: marks checks for facility_name_min_time_spent_per_visit_date dataset
    facility_type_avg_time_spent_per_visit_date: marks checks for facility_type_avg_time_spent_per_visit_date dataset
    patient_sum_treatment_cost_per_facility_type: marks checks for patient_sum_treatment_cost_per_facility_type dataset
