[pytest]
# marks
# python_files
# addopts

minversion = 8.0

testpaths =
    test_csv

python_files =
    test_*.py

python_functions =
    test_*

addopts =
    --strict-markers
    --tb=short
    --html=reports/default_report.html

markers =
    validate_csv: marks tests that validate CSV content and CSV data quality
    unmarked: marks tests without explicitly specified PyTest marks